name: aelc-platform-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aelc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aelc}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # AELC central consumer API — see docs/superpowers/specs on the AELC
      # side and CONSUMER_API_TOKEN issuance via `engineering-central admin
      # consumer issue`. Required so SyncScheduler actually runs instead of
      # silently no-op'ing (see apps/api/src/sync/sync.scheduler.ts).
      CONSUMER_API_BASE_URL: ${CONSUMER_API_BASE_URL:?CONSUMER_API_BASE_URL is required}
      CONSUMER_API_TOKEN: ${CONSUMER_API_TOKEN:?CONSUMER_API_TOKEN is required}
      SYNC_COMPLETENESS_WINDOW_DAYS: ${SYNC_COMPLETENESS_WINDOW_DAYS:-7}
      SYNC_RECORDS_INTERVAL_MS: ${SYNC_RECORDS_INTERVAL_MS:-300000}
      SYNC_COMPLETENESS_INTERVAL_MS: ${SYNC_COMPLETENESS_INTERVAL_MS:-3600000}
    command: sh -c "node apps/api/dist/db/migrate.js && node apps/api/dist/main.js"
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
